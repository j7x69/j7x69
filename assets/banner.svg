<svg xmlns="http://www.w3.org/2000/svg" width="850" height="186" viewBox="0 0 850 186" fill="none">
  <defs>
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#27272A" fill-opacity="0.45"/>
    </pattern>
    <radialGradient id="subtleWarmth" cx="760" cy="30" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.06"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bannerClip">
      <rect x="0.5" y="0.5" width="849" height="185" rx="12"/>
    </clipPath>
  </defs>

  <style>
    .cursor-blink {
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .status-pulse {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <rect x="0.5" y="0.5" width="849" height="185" rx="12" fill="#09090B"/>
    <rect x="37" y="37" width="519" height="148" fill="url(#dotMatrix)" opacity="0.65"/>
    <rect x="0.5" y="0.5" width="849" height="185" fill="url(#subtleWarmth)"/>

    <!-- Top Terminal Bar -->
    <rect x="0.5" y="0.5" width="849" height="36" fill="#0D0D10"/>
    <line x1="0.5" y1="36.5" x2="849.5" y2="36.5" stroke="#1C1C21" stroke-width="1"/>

    <!-- Minimal Window Controls -->
    <circle cx="22" cy="18.5" r="4" fill="#DC2626" opacity="0.85"/>
    <circle cx="36" cy="18.5" r="4" fill="#27272A"/>
    <circle cx="50" cy="18.5" r="4" fill="#27272A"/>

    <!-- Terminal Path -->
    <text x="68" y="22.5" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
      <tspan fill="#FAFAFA" font-weight="600">~/j7x69</tspan>
      <tspan fill="#71717A"> — systems &amp; media engineering</tspan><tspan fill="#F59E0B" font-weight="700" class="cursor-blink">_</tspan>
    </text>

    <!-- Geometric Vietnam + Timezone Pill -->
    <rect x="724" y="8.5" width="108" height="20" rx="10" fill="#141419" stroke="#27272A" stroke-width="1"/>
    <rect x="733" y="13.5" width="14" height="10" rx="1.8" fill="#DC2626"/>
    <polygon points="740.00,15.20 740.74,17.48 743.14,17.48 741.20,18.89 741.94,21.17 740.00,19.76 738.06,21.17 738.80,18.89 736.86,17.48 739.26,17.48" fill="#FBBF24"/>
    <text x="754" y="22" fill="#A1A1AA" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.4">VN · UTC+7</text>

    <!-- Bento Structural Dividers -->
    <line x1="556.5" y1="36.5" x2="556.5" y2="185.5" stroke="#1C1C21" stroke-width="1"/>
    <line x1="556.5" y1="94.5" x2="849.5" y2="94.5" stroke="#1C1C21" stroke-width="1"/>
    <line x1="654.5" y1="94.5" x2="654.5" y2="185.5" stroke="#1C1C21" stroke-width="1"/>
    <line x1="752.5" y1="94.5" x2="752.5" y2="185.5" stroke="#1C1C21" stroke-width="1"/>

    <!-- Left Hero Column -->
    <text x="28" y="63" fill="#71717A" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2">SOFTWARE ENGINEER  //  CLIENT &amp; MEDIA SYSTEMS</text>

    <text x="28" y="102" fill="#FAFAFA" font-family="'SF Pro Display', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">Jax</text>
    <text x="92" y="100" fill="#71717A" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="500">@j7x69</text>

    <text x="28" y="132" fill="#A1A1AA" font-family="'SF Pro Display', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">Building zero-bloat media tooling, binary container pipelines,</text>
    <text x="28" y="153" fill="#A1A1AA" font-family="'SF Pro Display', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">browser runtime extensions, and native client utilities.</text>

    <!-- Right Bento Top: Active Shipping Status -->
    <circle cx="579" cy="60" r="6.5" fill="#10B981" class="status-pulse"/>
    <circle cx="579" cy="60" r="3" fill="#10B981"/>
    <text x="593" y="63.5" fill="#FAFAFA" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.7">ACTIVE DISTRIBUTION</text>
    <text x="593" y="80" fill="#71717A" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="10.5">Chrome Web Store · Android APK</text>

    <!-- Right Bento Bottom: 3 Clean Telemetry Cells -->
    <text x="605.5" y="138" fill="#FAFAFA" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">57</text>
    <text x="605.5" y="160" fill="#71717A" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">DOWNLOADS</text>

    <text x="703.5" y="138" fill="#FBBF24" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">4</text>
    <text x="703.5" y="160" fill="#71717A" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">STARS</text>

    <text x="801" y="138" fill="#FAFAFA" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">5</text>
    <text x="801" y="160" fill="#71717A" font-family="'JetBrains Mono', 'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="0.8" text-anchor="middle">REPOS</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="185" rx="12" stroke="#27272A" stroke-width="1"/>
</svg>
