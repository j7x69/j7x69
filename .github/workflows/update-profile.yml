name: Update Profile README & SVGs

on:
  schedule:
    # Off-peak minute (:37) every 2 hours to avoid GitHub's :00/:30 UTC cron queue drops
    - cron: '37 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [sync-profile]
  push:
    branches:
      - main

concurrency:
  group: update-profile-svg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Minimalist Bento SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python generate_svg.py

      - name: Generate Contribution Snake SVG (Obsidian Crimson/Amber Palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#f59e0b&color_dots=#131317,#3f131d,#881337,#be123c,#e11d48

      - name: Commit and Push updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync profile telemetry SVGs [skip ci]"
            git pull --rebase origin main
            git push
          fi
